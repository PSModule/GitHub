name: Process-PSModule

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
  pull_request:
    branches:
      - main
    types:
      - closed
      - opened
      - reopened
      - synchronize
      - labeled

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  statuses: write
  pages: write
  id-token: write

jobs:
  Process-PSModule:
    uses: PSModule/Process-PSModule/.github/workflows/workflow.yml@b11b310e461f08ee99055b0827ef7909dea7110a # v6.1.14
    secrets:
      APIKey: ${{ secrets.APIKey }}
      TestData: >-
        {
          "secrets": {
            "TEST_USER_USER_FG_PAT":    "${{ secrets.TEST_USER_USER_FG_PAT }}",
            "TEST_USER_ORG_FG_PAT":     "${{ secrets.TEST_USER_ORG_FG_PAT }}",
            "TEST_USER_PAT":            "${{ secrets.TEST_USER_PAT }}",
            "TEST_APP_ORG_CLIENT_ID":   "${{ secrets.TEST_APP_ORG_CLIENT_ID }}",
            "TEST_APP_ORG_PRIVATE_KEY": "${{ secrets.TEST_APP_ORG_PRIVATE_KEY }}",
            "TEST_APP_ENT_CLIENT_ID":   "${{ secrets.TEST_APP_ENT_CLIENT_ID }}",
            "TEST_APP_ENT_PRIVATE_KEY": "${{ secrets.TEST_APP_ENT_PRIVATE_KEY }}"
          }
        }
